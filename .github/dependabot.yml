version: 2

# Pins here are manual, so without this file they go stale unnoticed.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request for all actions, not one per action. The repository is
    # reviewed a pull request at a time.
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    # Dependabot writes its own subject line, and the commit-msg hook rejects
    # the default. This produces `ci(deps): bump ...`, which it accepts. The
    # type is ci rather than build because the repository has no build and
    # every dependency here belongs to a workflow.
    commit-message:
      prefix: ci
      include: scope
    labels: ["type: dependencies", "area: ci"]

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
      include: scope
    labels: ["type: dependencies", "area: ci"]
